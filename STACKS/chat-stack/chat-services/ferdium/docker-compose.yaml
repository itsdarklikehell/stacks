services:
  ferdium:
    image: lscr.io/linuxserver/ferdium:latest
    container_name: ${NAME:-ferdium}
    restart: ${RESTART:-unless-stopped}

    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.ouroboros.enable=true
      - autoheal=true
      - autoheal-app
      - autoheal-app=true
      - homarr-app=true
      - homarr

    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Amsterdam}

      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
      - DOCKER_MODS=linuxserver/mods:universal-package-install|linuxserver/mods:universal-git|linuxserver/mods:universal-cron|lscr.io/linuxserver/mods:universal-unrar6
      # - DOCKER_HOST=
      - INSTALL_PACKAGES=libfuse2|git|gdb
      - RESTART_APP=true

    volumes:
      - /etc/localtime:/etc/localtime:ro
      # - /etc/timezone:/etc/timezone:ro
      - /var/run/docker.sock:/var/run/docker.sock

      - ferdium_config:/config

    hostname: ${NAME:-ferdium}

    networks:
      host:
      chat-services:

    env_file:
      - ./ferdium/.env

    ports:
      - ${PORT:-5636}:3000
      - 3678:3001

    tty: true

    stdin_open: true

    # shm_size: 1gb    healthcheck:
      test: [CMD-SHELL, curl -f http://localhost:/ || exit 1]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3


    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
